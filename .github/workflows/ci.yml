name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show the pinned Maven runtime
        run: ./mvnw --version

      - name: Run regression tests and strict JavaDoc checks
        run: >-
          python3 scripts/test_report.py
          --report-dir .internal-docs/release-reports/ci
          --name java21-verification --
          ./mvnw --batch-mode --no-transfer-progress clean verify javadoc:javadoc javadoc:test-javadoc

      - name: Check the signed publication lifecycle locally
        run: >-
          python3 scripts/test_report.py
          --report-dir .internal-docs/release-reports/ci
          --name publication-regressions --
          python3 .github/scripts/test-central-publishing.py
          --report-dir .internal-docs/release-reports/ci/publication-cases

      - name: Check whitespace
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_REVISION" ]] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
            git diff --check "$BASE_REVISION" HEAD
          else
            git show --format= --check HEAD
          fi

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java21-verification-${{ github.sha }}
          path: .internal-docs/release-reports/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
