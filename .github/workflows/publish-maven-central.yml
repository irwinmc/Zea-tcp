name: Publish to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java 21 and Central authentication
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central-publisher
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Show the pinned Maven runtime
        run: ./mvnw --version

      - name: Validate the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = ET.parse('pom.xml').getroot().findtext('m:version', namespaces=namespace)
          tag = os.environ['RELEASE_TAG']
          tag_version = tag.removeprefix('v')
          if not version or not re.fullmatch(r'[0-9][0-9A-Za-z._-]*', version):
              sys.exit('::error::The POM must contain a literal release version starting with a digit.')
          if version.upper().endswith('-SNAPSHOT'):
              sys.exit('::error::GitHub Releases cannot publish SNAPSHOT versions through this workflow.')
          if tag_version != version:
              sys.exit(f'::error::Release tag {tag!r} does not match POM version {version!r}.')
          print(f'Releasing com.akakata:zea-tcp:{version}')
          PY

      - name: Check publishing secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          for secret in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [[ -z "${!secret}" ]]; then
              printf '::error::Missing repository secret: %s\n' "$secret"
              exit 1
            fi
          done

      - name: Run tests and validate English JavaDoc
        run: ./mvnw --batch-mode --no-transfer-progress clean verify javadoc:javadoc javadoc:test-javadoc

      - name: Check the signed publication lifecycle locally
        run: python3 .github/scripts/test-central-publishing.py

      - name: Sign and publish the release
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
          -DskipTests -Dgpg.signer=bc -Dgpg.bestPractices=true
