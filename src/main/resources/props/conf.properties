# ============================================================
# Server Enable/Disable Configuration
# Set to false to disable a specific server
# ============================================================
server.tcp.enabled=true
server.http.enabled=true
server.websocket.enabled=true

# ============================================================
# Listener Ports and Bind Addresses
# All ports and addresses are required; invalid values fail initialization.
# ============================================================
tcp.port=8090
http.port=8081
web.socket.port=8300
tcp.bind.host=0.0.0.0
http.bind.host=127.0.0.1
web.socket.bind.host=0.0.0.0

# ============================================================
# Thread Configuration
# ============================================================
bossThreadCount=2
workerThreadCount=2

# ============================================================
# Socket Options
# ============================================================
so.backlog=100
so.reuseaddr=true
so.keepalive=true
tcp.nodelay=true

# ============================================================
# Reconnect Configuration
# ============================================================
reconnect.delay=300000

# ============================================================
# Protocol Configuration
# Options: SBE or JSON
# ============================================================
protocol.type=JSON

# ============================================================
# Authentication and Tokens
# Supply an application CredentialsVerifier; anonymous mode is for local demos only.
# A blank environment-variable name generates an ephemeral key per SecurityService.
# For persistent keys, name an environment variable containing a Base64 AES key.
# ============================================================
security.allow.anonymous=false
security.token.key.environment=
security.token.ttl.seconds=3600

# ============================================================
# Session Admission
# New credentials are rejected at capacity; existing players are never evicted.
# ============================================================
session.maximum=10000

# ============================================================
# Session Event Dispatch
# Task capacity is per shard and must be at least 16.
# The 64 MiB payload budget includes running callbacks.
# ============================================================
session.dispatcher.shards=2
session.queue.capacity=32768
session.queue.bytes=67108864

# ============================================================
# Game Event Dispatch
# Task capacity must be at least 16.
# The 64 MiB payload budget includes running callbacks.
# ============================================================
game.queue.capacity=32768
game.queue.bytes=67108864

# ============================================================
# Socket Connections and Timeouts
# TCP, WebSocket and HTTP share the connection limit, including unauthenticated clients.
# Timeouts are in milliseconds; zero read idle disables expiry.
# ============================================================
socket.maximum.connections=20000
socket.login.timeout.millis=30000
socket.read.idle.millis=120000

# ============================================================
# Socket Outbound Backpressure
# Source and encoded-byte allowances coexist until write completion.
# Per-connection source and encoded limits are 1 MiB each.
# The aggregate 256 MiB allowance applies to all listeners.
# ============================================================
socket.maximum.pending.writes=1024
socket.maximum.pending.bytes=1048576
socket.maximum.pending.payload.bytes=1048576
socket.total.pending.bytes=268435456

# ============================================================
# Protocol Frame Limits
# Inbound application frame bytes, excluding transport headers; valid range: 8..65535.
# ============================================================
protocol.maximum.frame.bytes=65535

# ============================================================
# HTTP Request Limits
# HTTP has request and read-idle deadlines, not a game login deadline.
# The absolute request deadline is renewed after each complete request body.
# ============================================================
http.maximum.connections=256
http.maximum.request.bytes=65536
http.request.timeout.millis=10000
http.read.idle.millis=30000

# ============================================================
# Blocking Business Operations
# Queued operations exclude running workers; the byte budget includes both.
# Operations return detached results and must use external dependency timeouts.
# ============================================================
business.blocking.threads=2
business.blocking.queue.capacity=256
business.blocking.queue.bytes=67108864
business.blocking.shutdown.millis=5000

# ============================================================
# Lifecycle and Health
# Timeouts bound observation, never early release of active resources.
# Health checks use the oldest queued or running event age.
# ============================================================
server.shutdown.timeout.millis=5000
health.maximum.event.delay.millis=5000
