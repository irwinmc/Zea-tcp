# ============================================================
# Server Enable/Disable Configuration
# Set to false to disable a specific server
# ============================================================
server.tcp.enabled=true
server.http.enabled=true
server.websocket.enabled=true

# ============================================================
# Port Configuration
# ============================================================
tcp.port=8090
http.port=8081
web.socket.port=8300

# ============================================================
# Thread Configuration
# ============================================================
bossThreadCount=2
workerThreadCount=2

# ============================================================
# Socket Options
# ============================================================
so.backlog=100
so.reuseaddr=true
so.keepalive=true
tcp.nodelay=true

# ============================================================
# Reconnect Configuration
# ============================================================
reconnect.delay=300000

# ============================================================
# Protocol Configuration
# Options: SBE or JSON
# ============================================================
protocol.type=JSON

# ============================================================
# Session Admission
# New credentials are rejected at capacity; existing players are never evicted.
# ============================================================
session.maximum=10000

# ============================================================
# Session Event Dispatch
# Task capacity is per shard and must be at least 16.
# The 64 MiB payload budget includes running callbacks.
# ============================================================
session.dispatcher.shards=2
session.queue.capacity=32768
session.queue.bytes=67108864

# ============================================================
# Game Event Dispatch
# Task capacity must be at least 16.
# The 64 MiB payload budget includes running callbacks.
# ============================================================
game.queue.capacity=32768
game.queue.bytes=67108864

# ============================================================
# Socket Connections and Timeouts
# TCP and WebSocket share the connection limit, including unauthenticated clients.
# Timeouts are in milliseconds; zero read idle disables expiry.
# ============================================================
socket.maximum.connections=20000
socket.login.timeout.millis=30000
socket.read.idle.millis=120000

# ============================================================
# Socket Outbound Backpressure
# Write and encoded-byte budgets must be positive.
# The encoded-byte budget is 1 MiB per connection.
# ============================================================
socket.maximum.pending.writes=1024
socket.maximum.pending.bytes=1048576

# ============================================================
# Protocol Frame Limits
# Inbound application frame bytes, excluding transport headers; valid range: 8..65535.
# ============================================================
protocol.maximum.frame.bytes=65535
