# ============================================================
# Test Configuration: WebSocket Only
# ============================================================

server.tcp.enabled=false
server.http.enabled=false
server.websocket.enabled=true

web.socket.port=18300

bossThreadCount=1
workerThreadCount=2

so.backlog=100
so.reuseaddr=true
so.keepalive=true
tcp.nodelay=true

protocol.type=JSON

# Required listener settings; the component constructs every listener.
tcp.port=8090
tcp.bind.host=0.0.0.0
http.port=8081
http.bind.host=127.0.0.1
web.socket.bind.host=0.0.0.0
